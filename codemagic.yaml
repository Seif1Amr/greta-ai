workflows:
  ios-release:
    name: Greta AI Learning German - iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Set up dependencies
        script: |
          flutter pub get
      - name: Install iOS Pods
        script: |
          cd ios
          pod install
          cd ..
      - name: Build iOS Release
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
    publishing:
      email:
        recipients:
          - seifamroltaha@gmail.com
        notify:
          success: true
          failure: true
