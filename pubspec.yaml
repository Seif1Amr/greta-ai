name: greta_ai_german
description: "Greta AI Learning German - Spoken German tutor powered by AI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  google_mobile_ads: ^5.2.0
  get_storage: ^2.1.1
  provider: ^6.1.2
  permission_handler: ^11.3.1
  http: ^1.2.2
  vibration: ^2.0.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/images/
    - assets/icon/
